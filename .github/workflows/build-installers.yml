name: Build HK STORE installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor Android project
        run: |
          npm install
          npm run prepare:web
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Test LAN API integration
        run: node scripts/test-lan.cjs
      - name: Prepare app files
        run: npm run prepare:web
      - name: Build Windows portable EXE
        run: npm run windows
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

name: Build HK STORE installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor Android project
        run: |
          npm install
          npm run prepare:web
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build llama.cpp runtime
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git $env:RUNNER_TEMP/llama.cpp
          cmake -S "$env:RUNNER_TEMP/llama.cpp" -B "$env:RUNNER_TEMP/llama-build" -A x64 -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build "$env:RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 2
          New-Item -ItemType Directory -Force resources/ai/bin, resources/ai/models | Out-Null
          $server = Get-ChildItem "$env:RUNNER_TEMP/llama-build" -Filter llama-server.exe -Recurse | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not produced by the native build." }
          Copy-Item $server.FullName resources/ai/bin/llama-server.exe
          Get-ChildItem $server.DirectoryName -Filter *.dll | Copy-Item -Destination resources/ai/bin
      - name: Download and verify bundled Qwen model
        shell: pwsh
        run: |
          $model = "resources/ai/models/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          $url = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf?download=true"
          Invoke-WebRequest -Uri $url -OutFile $model
          $size = (Get-Item $model).Length
          if ($size -lt 1500000000) { throw "Downloaded GGUF model is unexpectedly small ($size bytes)." }
          Get-FileHash $model -Algorithm SHA256 | Format-List
      - name: Install dependencies
        run: npm install
      - name: Test password hashing and legacy migration
        run: node scripts/test-auth.cjs
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Test role permissions and inventory validation
        run: node scripts/test-permissions.cjs
      - name: Test LAN API integration
        run: node scripts/test-lan.cjs
      - name: Prepare app files
        run: npm run prepare:web
      - name: Build Windows portable EXE with embedded AI
        run: npm run windows
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

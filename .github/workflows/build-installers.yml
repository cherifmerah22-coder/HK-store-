name: Build HK STORE installers

concurrency:
  group: hk-store-installers-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor Android project
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm install
          npm run prepare:web
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify official llama.cpp Windows CPU runtime
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b12720/llama-b12720-bin-win-cpu-x64.zip"
          $expected = "27ac9fdbb5602ab671c4ab901f80521a9fabbcd0b0341ad497a3102633b45c46"
          $zip = Join-Path $env:RUNNER_TEMP "llama-win-cpu.zip"
          $extract = Join-Path $env:RUNNER_TEMP "llama-win-cpu"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "llama.cpp runtime SHA256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force resources/ai/bin, resources/ai/models | Out-Null
          $server = Get-ChildItem $extract -Filter llama-server.exe -Recurse | Select-Object -First 1
          if (-not $server) { throw "Official archive does not contain llama-server.exe." }
          Copy-Item $server.FullName resources/ai/bin/llama-server.exe
          Get-ChildItem $server.DirectoryName -Filter *.dll | Copy-Item -Destination resources/ai/bin
          if (-not (Test-Path resources/ai/bin/llama-server.exe)) { throw "Runtime copy failed." }
      - name: Download and verify bundled Apache-2.0 Qwen 1.5B model
        shell: pwsh
        run: |
          $model = "resources/ai/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          $url = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true"
          Invoke-WebRequest -Uri $url -OutFile $model
          $size = (Get-Item $model).Length
          if ($size -lt 800000000) { throw "Downloaded GGUF model is unexpectedly small ($size bytes)." }
          Get-FileHash $model -Algorithm SHA256 | Format-List
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/LICENSE" -OutFile "resources/ai/LICENSE-QWEN.txt"
      - name: Smoke-test bundled local AI runtime
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "resources/ai/bin/llama-server.exe" -ArgumentList @("--model","resources/ai/models/qwen2.5-1.5b-instruct-q4_k_m.gguf","--host","127.0.0.1","--port","11435","--ctx-size","1024","--n-gpu-layers","0") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($server.HasExited) { throw "llama-server exited before becoming ready." }
              try { $health = Invoke-RestMethod "http://127.0.0.1:11435/health" -TimeoutSec 3; if ($health.status -eq "ok" -or $health) { $ready = $true; break } } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "Bundled AI server did not become healthy within 180 seconds." }
            $models = Invoke-RestMethod -Uri "http://127.0.0.1:11435/v1/models" -TimeoutSec 10
            $modelId = $models.data[0].id
            if (-not $modelId) { throw "llama-server did not report a loaded model." }
            $body = @{ model = $modelId; messages = @(@{ role = "user"; content = "Reply with the single word OK." }); stream = $false; max_tokens = 12 } | ConvertTo-Json -Depth 6
            $answer = Invoke-RestMethod -Uri "http://127.0.0.1:11435/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 120
            if (-not $answer.choices[0].message.content) { throw "Bundled AI returned an empty answer." }
            Write-Host "Bundled AI smoke test passed: $($answer.choices[0].message.content)"
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Install dependencies
        run: npm install
      - name: Test password hashing and legacy migration
        run: node scripts/test-auth.cjs
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Test role permissions and inventory validation
        run: node scripts/test-permissions.cjs
      - name: Test LAN API integration
        run: node scripts/test-lan.cjs
      - name: Prepare app files
        run: npm run prepare:web
      - name: Build Windows portable EXE with embedded AI
        run: npm run windows
      - uses: actions/upload-artifact@v4
        with:
          name: HK-STORE-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
